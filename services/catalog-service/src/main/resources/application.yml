spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true          # Java 21 virtual threads: blocking JDBC without thread-pool tuning
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USER:catalog}
    password: ${CATALOG_DB_PASSWORD:catalog}
    hikari:
      maximum-pool-size: ${CATALOG_DB_POOL:20}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  mvc:
    problemdetails:
      enabled: true

pulse:
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval: PT1S

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true        # /actuator/health/liveness + /readiness for Kubernetes
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

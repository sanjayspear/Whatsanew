[project]
name = "pulse-ai"
version = "0.1.0"
description = "Pulse AI server: server-side intent frames, cohort re-ranking, eval harness, distillation pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Heavy training/export stack, installed only on GPU training nodes (see pipelines/distill).
train = ["torch", "transformers", "peft", "datasets", "ai-edge-torch", "coremltools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pulse_ai"]

name: ci
on:
  pull_request:
  push: { branches: [main] }

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.f.outputs.packages }}
      services: ${{ steps.f.outputs.services }}
      mobile: ${{ steps.f.outputs.mobile }}
      ai: ${{ steps.f.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: ['gradle/**', 'build-logic/**', 'packages/**']
            packages: ['packages/**', 'build-logic/**', 'gradle/**']
            services: ['services/**', 'packages/**', 'build-logic/**', 'gradle/**']
            mobile: ['apps/mobile/**', 'packages/**', 'build-logic/**', 'gradle/**']
            ai: ['ai-server/**', 'packages/ui-dsl/examples/**']

  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p packages :ui-dsl:jvmTest

  services:
    needs: changes
    if: needs.changes.outputs.services == 'true'
    runs-on: ubuntu-latest      # Docker available: Testcontainers ITs run here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p services test

  mobile-shared:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p apps/mobile :shared:core:desktopTest :desktopApp:screenshots
      - uses: actions/upload-artifact@v4
        with: { name: screenshots, path: docs/screenshots }

  android:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest      # Android SDK preinstalled on GitHub runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p apps/mobile :androidApp:assembleDebug

  ios:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p apps/mobile :shared:core:iosSimulatorArm64Test -Ppulse.android=false

  ai-server:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]' && pytest -q

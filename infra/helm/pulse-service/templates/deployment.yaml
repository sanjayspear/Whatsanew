apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels: { app: {{ .Values.name }} }
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: {{ .Values.name }} }
  template:
    metadata:
      labels: { app: {{ .Values.name }} }
      annotations:
        sidecar.istio.io/inject: "{{ .Values.mesh.injectSidecar }}"
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "{{ .Values.port }}"
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ containerPort: {{ .Values.port }} }]
          env:
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          {{- if .Values.secretEnvFrom }}
          envFrom: [{ secretRef: { name: {{ .Values.secretEnvFrom }} } }]
          {{- end }}
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: {{ .Values.port }} }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: {{ .Values.port }} }, initialDelaySeconds: 30 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Values.name }} }
spec:
  selector: { app: {{ .Values.name }} }
  ports: [{ name: http, port: 80, targetPort: {{ .Values.port }} }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ .Values.name }} }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: {{ .Values.name }} } }
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ .Values.name }} }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ .Values.name }} }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPU }} } }
{{- end }}

# Local backing services: docker compose -f infra/local/docker-compose.yml up -d
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_DB: catalog, POSTGRES_USER: catalog, POSTGRES_PASSWORD: catalog }
    ports: ["5432:5432"]
  kafka:
    image: redpandadata/redpanda:v24.2.7     # Kafka API compatible, single binary for dev
    command: redpanda start --overprovisioned --smp 1 --memory 1G --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr localhost:9092
    ports: ["9092:9092"]
  redis:
    image: redis:7.4
    ports: ["6379:6379"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    ports: ["4317:4317", "4318:4318"]
